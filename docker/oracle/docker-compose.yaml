services:
  oracle:
    image: container-registry.oracle.com/database/free:23.26.1.0-lite
    container_name: oracle
    ports:
      - 1521:1521
    environment:
      ORACLE_PWD: oracle
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: [CMD-SHELL, '/opt/oracle/checkDBStatus.sh || exit 1']
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    network_mode: bridge
    restart: no

volumes:
  oracle-data:
